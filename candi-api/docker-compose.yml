services:
  postgres:
    image: postgres:16-alpine
    container_name: candidatures-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidatures
      POSTGRES_USER: candidatures_user
      POSTGRES_PASSWORD: candidatures_pwd
    ports:
      - "5432:5432"
    volumes:
      - candidatures_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidatures_user -d candidatures"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  candidatures_pgdata:
    name: candidatures_pgdata
